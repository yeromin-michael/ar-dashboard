name: pages
# Publishes the dashboard (fictional sample data only) to GitHub Pages.
# Rebuilds daily so the as-of date and aging stay current.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Deny-list scan
        env:
          AR_DENYLIST: ${{ secrets.AR_DENYLIST }}
        run: python scripts/check_denylist.py
      - name: Build (sample connector only)
        run: |
          python -c "import json,sys; c=json.load(open('config.json')); sys.exit(0 if c['connector']=='sample' else 'Pages only publishes sample data')"
          python build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
