name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deny-list scan
        env:
          AR_DENYLIST: ${{ secrets.AR_DENYLIST }}
        run: python scripts/check_denylist.py
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python build.py
